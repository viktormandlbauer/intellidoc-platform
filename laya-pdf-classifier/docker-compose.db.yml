# PostgreSQL (with the pgvector extension available) for local development. Dev credentials: do not expose this.
#   docker compose -f docker-compose.yml -f docker-compose.db.yml up --build
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pdfclf
      POSTGRES_PASSWORD: pdfclf
      POSTGRES_DB: pdfclf
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfclf -d pdfclf"]
      interval: 5s
      retries: 30

  pdfclf:
    environment:
      DATABASE_URL: postgresql://pdfclf:pdfclf@postgres:5432/pdfclf
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
